<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0D11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MotoLog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Personal motorcycle log for refuelings and engine oil.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>MotoLog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, Tiimo-style — serif hero, pastel tag pills, white task-cards, floating pill nav, bottom sheets */
:root{
  --bg:#F7F5FA; --surface:#FFFFFF; --surface-2:#F0EDF4; --line:#ECE8F1; --line-strong:#DCD7E3;
  --ink:#17151C; --ink-2:#56515F; --muted:#8C8796; --faint:#B5B0BE;
  --accent:#9D8BF4; --accent-ink:#5B47C9; --on-accent:#FFFFFF;
  --fuel:#E7E3FD; --fuel-ink:#5B47C9;
  --topup:#FDE7DA; --topup-ink:#B45A2B;
  --change:#FBF0C8; --change-ink:#86670C;
  --oil:#FDE7DA; --oil-ink:#B45A2B;
  --danger:#E5484D; --danger-wash:#FDECEC;
  --scrim:rgba(23,21,28,.22);
  --shadow:0 1px 2px rgba(23,21,28,.04),0 6px 20px rgba(23,21,28,.06);
  --shadow-lg:0 2px 6px rgba(23,21,28,.06),0 18px 48px rgba(23,21,28,.14);
  --font-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --font-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D11; --surface:#1A1920; --surface-2:#25232C; --line:#2A2831; --line-strong:#3A3742;
  --ink:#F3F1F6; --ink-2:#C6C2CD; --muted:#918C9B; --faint:#5E5A66;
  --accent:#A796F7; --accent-ink:#C8BCFF; --on-accent:#14121A;
  --fuel:#2A2645; --fuel-ink:#C6BBFF;
  --topup:#3A271D; --topup-ink:#F3AE87;
  --change:#352D14; --change-ink:#E9CB69;
  --oil:#3A271D; --oil-ink:#F3AE87;
  --danger:#FF6B6E; --danger-wash:#3B1C1E;
  --scrim:rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0D11; --surface:#1A1920; --surface-2:#25232C; --line:#2A2831; --line-strong:#3A3742;
  --ink:#F3F1F6; --ink-2:#C6C2CD; --muted:#918C9B; --faint:#5E5A66;
  --accent:#A796F7; --accent-ink:#C8BCFF; --on-accent:#14121A;
  --fuel:#2A2645; --fuel-ink:#C6BBFF;
  --topup:#3A271D; --topup-ink:#F3AE87;
  --change:#352D14; --change-ink:#E9CB69;
  --oil:#3A271D; --oil-ink:#F3AE87;
  --danger:#FF6B6E; --danger-wash:#3B1C1E;
  --scrim:rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--font-display);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:460px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(128px + env(safe-area-inset-bottom,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.topbar__r{display:flex;gap:8px}
.pill-btn{height:44px;padding:0 18px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.circle-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;transition:transform .15s,background .2s}
.circle-btn svg,.pill-btn svg{width:20px;height:20px}
.pill-btn:active,.circle-btn:active,.press:active{transform:scale(.96)}
.brand{font-family:var(--font-display);font-size:17px;letter-spacing:.005em}

.hero{text-align:center;margin:6px 0 16px}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:46px;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.hero p{color:var(--ink-2);font-size:16px;margin-top:6px}

/* month strip (Tiimo week strip) */
.mstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;scroll-snap-type:x proximity}
.mstrip::-webkit-scrollbar{display:none}
.mchip{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:center}
.mchip .c{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:13.5px;transition:background .25s,color .25s,transform .2s}
.mchip small{font-size:11px;color:var(--muted);font-weight:600;height:14px;display:flex;align-items:center;gap:4px}
.mchip .has{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.mchip[aria-pressed="true"] .c{background:var(--ink);color:var(--bg)}
.mchip[aria-pressed="true"] small{color:var(--ink)}

/* groups & tags */
.group{margin-top:26px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:32px}
.tag{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag svg{width:15px;height:15px}
.tag--fuel{background:var(--fuel);color:var(--fuel-ink)}
.tag--oil,.tag--topup{background:var(--topup);color:var(--topup-ink)}
.tag--change{background:var(--change);color:var(--change-ink)}
.tag--sm{height:24px;padding:0 9px;font-size:10px;letter-spacing:.09em;gap:5px}
.tag--sm svg{width:12px;height:12px}
.count{font-weight:700;opacity:.75}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.stack{display:flex;flex-direction:column;gap:8px}

/* activity rows (Tiimo task cards) */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:transform .15s,box-shadow .2s}
.row:hover{box-shadow:var(--shadow)}
.row:active{transform:scale(.985)}
.row__main{flex:1;min-width:0}
.row__title{font-weight:600;font-size:15px;line-height:1.25}
.row__sub{color:var(--ink-2);font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__when{text-align:right;flex:none;font-size:12.5px;color:var(--muted);line-height:1.35}
.row__when b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.tile svg{width:21px;height:21px}
.tile--fuel{background:var(--fuel);color:var(--fuel-ink)}
.tile--topup{background:var(--topup);color:var(--topup-ink)}
.tile--change{background:var(--change);color:var(--change-ink)}
.tile--lg{width:52px;height:52px;border-radius:16px}
.tile--lg svg{width:26px;height:26px}

.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1.5px dashed var(--line-strong);border-radius:16px;padding:14px 14px 14px 16px;color:var(--muted);font-size:14.5px}
.slot .plus{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.slot .plus svg{width:14px;height:14px}

.linkrow{display:flex;justify-content:center;margin-top:12px}
.ghost{height:40px;padding:0 16px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.ghost svg{width:16px;height:16px}

/* segmented (Tiimo toggle pills) */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;position:relative}
.seg button{height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(23,21,28,.1)}
.seg--lg{display:flex}
.seg--lg button{flex:1;height:40px;font-size:14.5px}

/* spending */
.spend{padding:20px 20px 18px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--font-display);font-size:44px;line-height:1.05;margin-top:6px;letter-spacing:-.01em}
.split{display:flex;gap:4px;height:10px;margin:16px 0 14px}
.split span{border-radius:999px;min-width:6px;transition:flex-grow .6s var(--ease)}
.split .s-fuel{background:var(--accent)}
.split .s-oil{background:var(--topup-ink);opacity:.75}
.split .s-none{background:var(--surface-2);flex:1}
.legend{display:grid;gap:8px}
.legend div{display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
.legend dt{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.legend dd{font-weight:600}
.legend .tot{border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
.legend .tot dt{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot--fuel{background:var(--accent)}
.dot--oil{background:var(--topup-ink);opacity:.75}

/* last-record card */
.last{padding:16px}
.last__head{display:flex;align-items:center;gap:12px}
.last__head .when{color:var(--muted);font-size:13px}
.last__head .what{font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.kv dt{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kv dd{font-size:16px;font-weight:600;margin-top:2px}
.kv dd small{font-weight:500;color:var(--muted);font-size:12.5px}

/* stat tiles (Tiimo insight tiles) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{border-radius:18px;padding:14px 14px 13px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat .v{font-family:var(--font-display);font-size:28px;line-height:1.05}
.stat .v small{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.stat .h{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.stat--fuel{background:var(--fuel);border-color:transparent}
.stat--fuel .l{color:var(--fuel-ink);opacity:.85}
.stat--oil{background:var(--topup);border-color:transparent}
.stat--oil .l{color:var(--topup-ink);opacity:.9}
.stat--change{background:var(--change);border-color:transparent}
.stat--change .l{color:var(--change-ink)}

/* chart */
.chart{padding:16px 16px 12px;margin-top:8px}
.chart__head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart__head h3{font-size:15px;font-weight:600}
.chart__legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.chart__legend span{display:inline-flex;align-items:center;gap:5px}
.chart svg{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.chart .note{font-size:13px;color:var(--muted);padding:18px 0 8px}
.ln-base{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.ar-base{fill:var(--accent);opacity:.12}
.dt-eff{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5}
.gridl{stroke:var(--line);stroke-width:1}
.axis{fill:var(--muted);font-size:10.5px;font-family:var(--font-body)}
.endlab{fill:var(--accent-ink);font-size:11px;font-weight:700;font-family:var(--font-body)}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.note-line{font-size:12.5px;color:var(--muted);margin-top:10px;padding:0 4px}
.prod{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;margin-top:8px}
.prod .l{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.prod .v{font-weight:600;text-align:right}

/* history */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.chipf{height:34px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.chipf svg{width:15px;height:15px}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{padding:16px;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.summary .full,.summary .wide{grid-column:1/-1}
.summary dt{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.summary dd{font-size:17px;font-weight:600;margin-top:2px}
.summary .full dd{font-family:var(--font-display);font-size:34px;font-weight:400;line-height:1.05}
.summary .full .cap{font-size:13px;color:var(--ink-2);margin-top:4px}

/* settings list (Tiimo "Me" list card) */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li svg.ic{width:20px;height:20px;color:var(--ink-2);flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:15px}
.li .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.li .r{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px;flex:none}
.li .r svg{width:16px;height:16px}
.li--danger b{color:var(--danger)}
.li--danger svg.ic{color:var(--danger)}
.sect{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 4px 8px}
.foot{text-align:center;margin-top:34px}
.foot h3{font-family:var(--font-display);font-weight:400;font-size:24px;text-wrap:balance}
.foot p{color:var(--muted);font-size:13.5px;margin-top:6px}
.foot small{display:block;color:var(--faint);font-size:12px;margin-top:14px}
.inline-input{width:96px;height:36px;border-radius:999px;border:0;background:var(--surface-2);text-align:right;padding:0 12px;font-weight:600}

/* bottom nav (Tiimo floating pill) */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(340px,calc(100% - 32px));height:68px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow-lg);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
.nav__ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:999px;background:var(--surface-2);transition:transform .45s var(--ease)}
.nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:999px;transition:color .2s}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}

/* layers: sheets + action sheets */
.layer{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.layer.blur .scrim{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.layer.on .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:460px;max-height:calc(100% - 36px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--bg);border-radius:30px 30px 0 0;box-shadow:var(--shadow-lg);transform:translateY(104%);transition:transform .48s var(--ease)}
.layer.on .sheet{transform:none}
.sheet__head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:16px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
.sheet__head h2{text-align:center;font-size:17px;font-weight:600}
.sheet__body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.save{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);transition:background .25s,transform .15s,opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.save svg{width:22px;height:22px}
.save:disabled{background:var(--surface-2);color:var(--faint);box-shadow:none;cursor:not-allowed}

.namecard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 14px 18px}
.namecard .serif{font-size:25px;line-height:1.1}
.namecard .sub{font-size:13px;color:var(--muted);margin-top:3px}

.fgroup{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:8px 14px 8px 18px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow > label,.frow > .lbl{font-size:15px;font-weight:500;flex:none}
.frow .opt{color:var(--faint);font-weight:500;font-size:12.5px;margin-left:4px}
.vpill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 6px 0 12px;border-radius:999px;background:var(--surface-2);min-width:0;transition:box-shadow .2s}
.vpill:focus-within{box-shadow:0 0 0 2px var(--accent)}
.vpill svg{width:16px;height:16px;color:var(--ink-2);flex:none}
.vpill input{border:0;background:transparent;outline:none;font-weight:600;font-size:15px;min-width:0;padding:0 6px 0 0}
.vpill input[type=date]{width:128px}
.vpill input[type=time]{width:92px}
.vpill .unit{font-weight:600;color:var(--muted);padding-right:8px;font-size:14px}
.vpill input.n{width:96px;text-align:right}
.vpill input.t{width:150px}
.vpill.bad{box-shadow:0 0 0 2px var(--danger)}
.unitseg{display:inline-flex;background:var(--surface);border-radius:999px;padding:2px;margin-left:2px}
.unitseg button{height:30px;min-width:38px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.unitseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ferr{color:var(--danger);font-size:12.5px;padding:0 6px}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);text-align:left;transition:border-color .2s,background .2s,transform .15s}
.type b{font-size:15px;font-weight:600}
.type span{font-size:12.5px;color:var(--muted);line-height:1.3}
.type[aria-checked="true"]{border-color:var(--ink)}
.type[aria-checked="true"].type--topup{background:var(--topup)}
.type[aria-checked="true"].type--change{background:var(--change)}
.type[aria-checked="true"] span{color:var(--ink-2)}

.calc{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.calc .l{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.calc .v{font-family:var(--font-display);font-size:26px;line-height:1.1;text-align:right}
.calc .cap{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:30ch}
.calc--empty .v{color:var(--faint)}

.more{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;font-weight:600}
.more svg{width:18px;height:18px;color:var(--muted);transition:transform .3s var(--ease)}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.notes{width:100%;min-height:92px;resize:vertical;border:0;background:transparent;padding:16px 18px;outline:none;font-size:15px}
.notes::placeholder,.vpill input::placeholder{color:var(--faint);font-weight:500}
.quick{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.quickrow{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px}

.detail-rows .frow{min-height:52px}
.detail-rows .val{font-weight:600;text-align:right}
.detail-rows .val small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.notebox{padding:14px 18px;color:var(--ink-2);white-space:pre-wrap}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.trash{width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--danger)}
.trash svg{width:22px;height:22px}
.cta{height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.cta svg{width:18px;height:18px}
.cta--wide{width:100%;justify-content:center}

/* action sheet (Tiimo context menu) */
.asheet{position:relative;width:calc(100% - 24px);max-width:440px;margin-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;transform:translateY(24px) scale(.96);opacity:0;transition:transform .42s var(--ease),opacity .25s}
.layer.on .asheet{transform:none;opacity:1}
.amenu{background:var(--surface);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden}
.amenu .msg{padding:18px 20px 12px;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.amenu .msg b{display:block;color:var(--ink);font-size:16px;margin-bottom:3px}
.aitem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);min-height:56px;transition:background .15s}
.aitem:last-child{border-bottom:0}
.aitem:active{background:var(--surface-2)}
.aitem .t b{display:block;font-weight:600;font-size:16px}
.aitem .t span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.aitem > svg{width:20px;height:20px;color:var(--ink-2)}
.aitem--danger{color:var(--danger)}
.aitem--danger > svg{color:var(--danger)}
.aitem .chk{margin-left:auto;width:20px;height:20px;color:var(--accent-ink)}
.acancel{height:56px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-lg);font-weight:600;font-size:16px}
.range-custom{display:flex;flex-direction:column;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.range-custom .frow{padding:0;min-height:48px;border:0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;transition:opacity .25s,transform .35s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center;display:flex;align-items:center;gap:8px}
.toast svg{width:16px;height:16px}
.toast.on{opacity:1;transform:translate(-50%,0)}

.banner{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:16px;background:var(--surface-2);font-size:13px;color:var(--ink-2);margin-top:12px}
.banner b{color:var(--ink)}
.banner .ghost{height:32px;font-size:13px;margin-left:auto;background:var(--surface);flex:none}

.skel{background:var(--surface-2);border-radius:18px;height:64px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.enter > *{animation:rise .45s var(--ease) both}
.enter > *:nth-child(2){animation-delay:.04s}.enter > *:nth-child(3){animation-delay:.08s}.enter > *:nth-child(4){animation-delay:.12s}.enter > *:nth-child(5){animation-delay:.16s}.enter > *:nth-child(6){animation-delay:.2s}.enter > *:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (max-width:360px){.hero h1{font-size:38px}.big{font-size:38px}.vpill input.n{width:76px}.vpill input[type=date]{width:118px}}

<script>
(function(){
"use strict";
/* ───────── icons ───────── */
const P = {
  fuel:'<path d="M4 20V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14"/><path d="M3 20h12M7 8h4"/><path d="M14 10h2a2 2 0 0 1 2 2v4.5a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
  drop:'<path d="M12 3.5s6 6.4 6 10.7a6 6 0 0 1-12 0C6 9.9 12 3.5 12 3.5z"/><path d="M12 11v6M9 14h6"/>',
  change:'<path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1"/><path d="M18.5 3v4.3h-4.3M5.5 21v-4.3h4.3"/><path d="M12 9.2s2 2.1 2 3.4a2 2 0 0 1-4 0c0-1.3 2-3.4 2-3.4z"/>',
  oil:'<path d="M4 12.5h9l5-3 2.5 1.5-5.5 7H5a1 1 0 0 1-1-1z"/><path d="M8 12.5V10h3v2.5M20.5 14.5s.9 1 .9 1.6a.9.9 0 0 1-1.8 0c0-.6.9-1.6.9-1.6z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  right:'<path d="M9 6l6 6-6 6"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  edit:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/>',
  gauge:'<path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 13l3.5-3.5"/><circle cx="12" cy="13" r="1"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  tag:'<path d="M3.5 12.5V5a1.5 1.5 0 0 1 1.5-1.5h7.5l8 8-9 9z"/><circle cx="8" cy="8" r="1.4"/>',
  db:'<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  filter:'<path d="M4 6h16M7 12h10M10 18h4"/>'
};
const ic = (n, cls) => `<svg${cls?` class="${cls}"`:''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ───────── helpers ───────── */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((Number(n)+Number.EPSILON)*100)/100;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MSHORT = MONTHS.map(m => m.slice(0,3));
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
function nowParts(){ const d = new Date(); return { date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, time:`${pad(d.getHours())}:${pad(d.getMinutes())}` }; }
const curMonth = () => nowParts().date.slice(0,7);
function parseNum(v){ if(v==null) return NaN; const s = String(v).trim().replace(/,/g,'.'); if(!s || !/^\d*\.?\d+$|^\d+\.$/.test(s)) return NaN; return parseFloat(s); }
function tk(n, dp){ n = Number(n)||0; const whole = Math.abs(n - Math.round(n)) < 0.005; const d = dp!=null ? dp : (whole?0:2);
  return '৳' + n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
const tkL = n => tk(n,2) + '/L';
const litres = (n, min=2) => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:min,maximumFractionDigits:2}) + ' L';
const oilQty = r => r.unit === 'mL' ? `${(Number(r.quantity)||0).toLocaleString('en-US',{maximumFractionDigits:1})} mL` : litres(r.quantity,1);
const trimL = n => (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:3}) + ' L';
const km = n => (Number(n)||0).toLocaleString('en-US') + ' km';
function dParts(dt){ const [d,t] = dt.split('T'); const [y,m,da] = d.split('-').map(Number); const [hh,mm] = (t||'00:00').split(':').map(Number); return {y,m,da,hh,mm, js:new Date(y,m-1,da,hh,mm)}; }
function fmtTime(dt){ const p = dParts(dt); const h = p.hh%12 || 12; return `${h}:${pad(p.mm)} ${p.hh<12?'AM':'PM'}`; }
function fmtDay(dt, withYear){ const p = dParts(dt); const t = nowParts().date; const d = dt.slice(0,10);
  const y = new Date(); y.setDate(y.getDate()-1); const yd = `${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`;
  if(d===t) return 'Today'; if(d===yd) return 'Yesterday';
  const base = `${p.da} ${MSHORT[p.m-1]}`; return withYear || p.y !== new Date().getFullYear() ? `${base} ${p.y}` : base; }
function fmtLong(dt){ const p = dParts(dt); return `${DAYS[p.js.getDay()]}, ${p.da} ${MONTHS[p.m-1]} ${p.y}`; }
function monthLabel(key){ const [y,m] = key.split('-').map(Number); return {name:MONTHS[m-1], short:MSHORT[m-1], y}; }
function addMonths(key, n){ let [y,m] = key.split('-').map(Number); m += n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${pad(m)}`; }

/* ───────── categories registry (future: oil filter, air filter, brake pads register here) ───────── */
const CATEGORIES = {
  fuel: { label:'Fuel', collection:'fuel' },
  oil:  { label:'Engine oil', collection:'oil' }
};

/* ───────── calculations (pure) ───────── */
const calc = {
  oilToLitres(q, unit){ q = Number(q)||0; return unit === 'mL' ? q/1000 : q; },
  fuelEffective(r){ return r.litres > 0 ? r.amount / r.litres : null; },
  oilEffective(r){ return r.litres > 0 && r.amount > 0 ? r.amount / r.litres : null; },
  sortDesc(a,b){ return a.dateTime < b.dateTime ? 1 : a.dateTime > b.dateTime ? -1 : ((b.createdAt||'') > (a.createdAt||'') ? 1 : -1); },
  inMonth(list, key){ return list.filter(r => r.dateTime.slice(0,7) === key); },
  inRange(list, from, to){ return list.filter(r => { const d = r.dateTime.slice(0,10); return (!from || d >= from) && (!to || d <= to); }); },
  sum(list, f){ return r2(list.reduce((a,r) => a + (Number(f(r))||0), 0)); },
  fuelSummary(list){
    const count = list.length, spend = calc.sum(list, r=>r.amount), L = r2(list.reduce((a,r)=>a+(Number(r.litres)||0),0)*1000)/1000;
    return { count, spend, litres:L, avgLitres: count ? L/count : 0, avgEffective: L>0 ? spend/L : null };
  },
  oilSummary(list){
    const topups = list.filter(r=>r.type==='topup'), changes = list.filter(r=>r.type==='change');
    const spend = calc.sum(list, r=>r.amount);
    const lt = l => Math.round(l.reduce((a,r)=>a+(Number(r.litres)||0),0)*10000)/10000;
    return { count:list.length, topups:topups.length, changes:changes.length, spend,
      topupLitres:lt(topups), changeLitres:lt(changes), totalLitres:lt(list),
      avgCost: list.length ? spend/list.length : null };
  },
  month(state, key){
    const f = calc.fuelSummary(calc.inMonth(state.fuel, key));
    const o = calc.oilSummary(calc.inMonth(state.oil, key));
    return { fuel:f, oil:o, combined: r2(f.spend + o.spend) };
  },
  timeline(state, filter){
    const rows = [];
    if(filter !== 'oil') state.fuel.forEach(r => rows.push(Object.assign({kind:'fuel'}, r)));
    if(filter !== 'fuel') state.oil.forEach(r => rows.push(Object.assign({kind:'oil'}, r)));
    return rows.sort(calc.sortDesc);
  }
};

/* ───────── example records (used only when this view has no shared store) ───────── */
function exampleRecords(){
  const now = new Date(); const fuel = [], oil = [];
  const at = (daysAgo, h, m) => { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-daysAgo, h, m); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(h)}:${pad(m)}`; };
  const stamp = new Date().toISOString();
  const Ls = [7.2,8.0,6.8,9.1,7.6,8.4,6.5,7.9];
  const times = [[8,15],[18,40],[9,5],[19,20],[7,50],[17,35],[13,10],[20,5]];
  let i = 0;
  for(let ago = 150; ago >= 7; ago -= 6, i++){
    const base = ago > 105 ? 125 : ago > 62 ? 122 : 120;
    const L = Ls[i%Ls.length], amt = Math.round(L*base/10)*10, t = times[i%times.length];
    fuel.push({ id:`fuel_ex${i}`, dateTime:at(ago,t[0],t[1]), litres:L, amount:amt, basePrice:base, notes:'', createdAt:stamp, updatedAt:stamp, sample:true });
  }
  fuel.push({ id:'fuel_exlast', dateTime:at(1,18,25), litres:8.5, amount:1020, basePrice:120, notes:'Full tank before the Sreemangal ride', createdAt:stamp, updatedAt:stamp, sample:true });
  const o = (id, ago, h, m, type, q, unit, amount, brand, grade, odo, notes) => oil.push({ id, type, dateTime:at(ago,h,m), quantity:q, unit, litres:calc.oilToLitres(q,unit), amount, brand, grade, odometerKm:odo, notes, createdAt:stamp, updatedAt:stamp, sample:true });
  o('oil_ex1',118,10,30,'change',1.0,'L',750,'Motul','10W-40',16240,'Changed at Bhai Bhai Motors, Zindabazar');
  o('oil_ex2',84,19,10,'topup',200,'mL',180,'Motul','10W-40',null,'');
  o('oil_ex3',57,9,0,'topup',250,'mL',225,'Motul','10W-40',null,'');
  o('oil_ex4',25,11,15,'change',1.0,'L',780,'ELF','10W-40',19105,'');
  o('oil_ex5',25,11,40,'topup',100,'mL',90,'ELF','10W-40',null,'Topped up the same day after the change');
  o('oil_ex6',3,8,20,'topup',200,'mL',180,'ELF','10W-40',null,'');
  return { fuel, oil };
}

/* ───────── store: shared artifact db, with on-device fallback ───────── */
const LS = 'motolog.v1';
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); return true; } catch(e){ return false; } };
const DEFAULT_SETTINGS = { defaultBasePrice:120, oilUnit:'mL' };

const Store = {
  mode:'loading', fuel:[], oil:[], settings:Object.assign({}, DEFAULT_SETTINGS), db:null, got:{}, unsubs:[], persisted:true,
  async boot(){
    const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
    if(!hasClaude){ this.startLocal(); return; }
    const timer = setTimeout(() => { if(this.mode === 'loading') this.startLocal(); }, 2500);
    let db = null; try { db = await window.claude.use('db'); } catch(e){ db = null; }
    clearTimeout(timer);
    if(db && !(this.mode === 'local' && this.localTouched)) this.startCloud(db);
    else if(this.mode === 'loading') this.startLocal();
  },
  startLocal(){
    this.unsubs.forEach(u => { try{u()}catch(e){} }); this.unsubs = [];
    this.mode = 'local';
    let data = null; try { data = JSON.parse(lsGet(LS) || 'null'); } catch(e){}
    if(data && Array.isArray(data.fuel)){ this.fuel = data.fuel; this.oil = data.oil||[]; this.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings||{}); }
    else { const ex = exampleRecords(); this.fuel = ex.fuel; this.oil = ex.oil; this.saveLocal(); }
    this.persisted = lsGet(LS) != null;
    App.render(true);
  },
  saveLocal(){ this.persisted = lsSet(LS, JSON.stringify({fuel:this.fuel, oil:this.oil, settings:this.settings})); },
  startCloud(db){
    this.unsubs.forEach(u => { try{u()}catch(e){} }); this.unsubs = [];
    this.db = db; this.mode = 'cloud'; this.got = {};
    const done = () => { if(this.got.fuel && this.got.oil && this.got.settings){ const first = !this.ready; this.ready = true; App.render(first); } };
    const onErr = e => { if(e && e.code !== 'unavailable') toast('Sync stopped. Changes now stay on this device.'); this.toLocalCopy(); };
    ['fuel','oil'].forEach(k => {
      this.unsubs.push(db.collection(CATEGORIES[k].collection).onSnapshot(snap => {
        this[k] = snap.docs.map(d => Object.assign({}, d.data(), {id:d.id})); this.got[k] = true;
        if(this.ready) App.render(false); else done();
      }, onErr));
    });
    this.unsubs.push(db.doc('settings/app').onSnapshot(snap => {
      this.settings = Object.assign({}, DEFAULT_SETTINGS, snap.exists ? snap.data() : {}); this.got.settings = true;
      if(this.ready) App.render(false); else done();
    }, onErr));
  },
  toLocalCopy(){
    this.unsubs.forEach(u => { try{u()}catch(e){} }); this.unsubs = [];
    this.mode = 'local'; this.readonlyCloud = true; this.saveLocal(); App.render(false);
  },
  async write(fn, localFn){
    if(this.mode === 'cloud'){
      try { await fn(); return true; }
      catch(e){
        const code = e && e.code;
        if(code === 'unavailable'){ await new Promise(r => setTimeout(r, 400 + Math.random()*600)); try { await fn(); return true; } catch(e2){} }
        if(code === 'quota_exceeded'){ toast('Storage is full. Delete some old records, then try again.'); return false; }
        if(code === 'invalid_argument' || code === 'not_granted' || code === 'revoked'){
          this.toLocalCopy(); localFn(); this.saveLocal(); App.render(false);
          toast('You can view this log but not change it, so this change stays on this device.'); return true;
        }
        toast('Couldn’t save. Check your connection and try again.'); return false;
      }
    }
    this.localTouched = true; localFn(); this.saveLocal(); App.render(false); return true;
  },
  put(kind, rec){
    const col = CATEGORIES[kind].collection;
    return this.write(() => this.db.collection(col).doc(rec.id).set(rec), () => {
      const i = this[kind].findIndex(r => r.id === rec.id); if(i >= 0) this[kind][i] = rec; else this[kind].push(rec);
    });
  },
  remove(kind, id){
    const col = CATEGORIES[kind].collection;
    return this.write(() => this.db.collection(col).doc(id).delete(), () => { this[kind] = this[kind].filter(r => r.id !== id); });
  },
  saveSettings(patch){
    const next = Object.assign({}, this.settings, patch);
    return this.write(() => this.db.doc('settings/app').set(next), () => { this.settings = next; });
  },
  async removeWhere(pred){
    const targets = [...this.fuel.filter(pred).map(r=>['fuel',r.id]), ...this.oil.filter(pred).map(r=>['oil',r.id])];
    if(this.mode === 'cloud'){ for(const [k,id] of targets){ const ok = await this.remove(k,id); if(!ok) return false; if(this.mode !== 'cloud'){ /* switched to local mid-way */ } } return true; }
    this.localTouched = true; this.fuel = this.fuel.filter(r => !pred(r)); this.oil = this.oil.filter(r => !pred(r)); this.saveLocal(); App.render(false); return true;
  },
  get find(){ return (kind, id) => this[kind].find(r => r.id === id); },
  get hasSamples(){ return this.fuel.some(r=>r.sample) || this.oil.some(r=>r.sample); }
};

function rowHTML(r, opts={}){

/* ───────── chart ───────── */
function priceChart(fuel){
  const pts = fuel.slice().sort((a,b)=> a.dateTime < b.dateTime ? -1 : 1).slice(-12);
  if(pts.length < 2) return `<p class="note">Log at least two refuelings to see how the base price moves.</p>`;
  const W = 320, H = 150, L = 34, R = 40, T = 12, B = 24;
  const vals = pts.flatMap(p => [Number(p.basePrice), calc.fuelEffective(p)]).filter(v => v!=null && isFinite(v));
  let lo = Math.floor(Math.min(...vals)) - 1, hi = Math.ceil(Math.max(...vals)) + 1;
  const span = hi - lo; const step = span <= 6 ? 2 : span <= 15 ? 5 : 10; lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const x = i => L + (W-L-R) * (i/(pts.length-1)), y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo));
  let grid = ''; for(let v = lo; v <= hi; v += step){ grid += `<line class="gridl" x1="${L}" x2="${W-R+8}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`; }
  const path = pts.map((p,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(p.basePrice).toFixed(1)}`).join('');
  const area = `${path}L${x(pts.length-1).toFixed(1)},${H-B}L${L},${H-B}Z`;
  const dots = pts.map((p,i) => `<circle class="dt-eff" cx="${x(i).toFixed(1)}" cy="${y(calc.fuelEffective(p)).toFixed(1)}" r="3"><title>${fmtDay(p.dateTime,true)}: effective ${tkL(calc.fuelEffective(p))}</title></circle>`).join('');
  const last = pts[pts.length-1];
  const dl = s => { const p = dParts(s); return `${p.da} ${MSHORT[p.m-1]}`; };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Base price per litre across the last ${pts.length} refuelings, from ${tk(pts[0].basePrice,2)} to ${tk(last.basePrice,2)}">
    ${grid}<path class="ar-base" d="${area}"/><path class="ln-base draw" d="${path}"/>${dots}
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(last.basePrice).toFixed(1)}" r="4.5" fill="var(--accent)"/>
    <text class="endlab num" x="${(x(pts.length-1)+8).toFixed(1)}" y="${(y(last.basePrice)+4).toFixed(1)}">${Math.round(last.basePrice*100)/100}</text>
    <text class="axis" x="${L}" y="${H-6}">${dl(pts[0].dateTime)}</text><text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${dl(last.dateTime)}</text></svg>`;
}

/* ───────── screens ───────── */
function monthsAvailable(){
  const cur = curMonth(); const all = [...Store.fuel, ...Store.oil].map(r => r.dateTime.slice(0,7)).filter(k => k <= cur).sort();
  let start = all.length ? all[0] : cur; const minStart = addMonths(cur, -5); const maxBack = addMonths(cur, -23);
  if(start > minStart) start = minStart; if(start < maxBack) start = maxBack;
  const has = new Set(all); const out = []; for(let k = start; k <= cur; k = addMonths(k,1)) out.push({k, has:has.has(k)}); return out;
}

    const tabChanged = this.lastTab !== UI.tab, monthChanged = this.lastMonth !== UI.month;
    if(!tabChanged && UI.tab === 'settings' && document.activeElement && document.activeElement.id === 'setBase') return;
    const keepScroll = !tabChanged ? window.scrollY : 0;
    root.innerHTML = UI.tab === 'overview' ? overviewHTML() : UI.tab === 'history' ? historyHTML() : settingsHTML();
    const enter = $('.enter', root); if(enter && !(animate || tabChanged)) enter.classList.remove('enter');

    this.lastTab = UI.tab; this.lastMonth = UI.month;
  },
  go(tab){ UI.tab = tab; this.render(true); }
};
function countUp(el){
  if(!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const target = Number(el.dataset.count)||0, t0 = performance.now(), dur = 520;
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1 - Math.pow(1-k,3); el.textContent = tk(Math.round(target*e)); if(k < 1) requestAnimationFrame(step); else el.textContent = tk(target); };
  requestAnimationFrame(step);
}
let toastTimer;
function toast(msg){ const t = $('#toast'); t.innerHTML = ic('check') + esc(msg); t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); }

/* ───────── layers ───────── */
const layers = [];
function openLayer(html, {kind='sheet', blur=false, onMount, label='Dialog'}={}){
  const el = document.createElement('div'); el.className = 'layer' + (blur ? ' blur' : '');
  el.innerHTML = `<div class="scrim" data-dismiss></div>${kind==='sheet' ? `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>` : `<div class="asheet" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`}`;
  document.body.appendChild(el); const prevFocus = document.activeElement;
  const layer = { el, close(){ closeLayer(layer); }, prevFocus };
  layers.push(layer); document.body.style.overflow = 'hidden';
  el.addEventListener('click', e => { if(e.target.closest('[data-dismiss]')) layer.close(); });
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  if(onMount) onMount(el, layer);
  setTimeout(() => { const f = $('[autofocus]', el) || $('button, input, textarea', $('.sheet, .asheet', el)); if(f && !el.contains(document.activeElement)) try{ f.focus({preventScroll:true}); }catch(e){} }, 60);
  return layer;
}
function closeLayer(layer){
  const i = layers.indexOf(layer); if(i < 0) return; layers.splice(i,1);
  layer.el.classList.remove('on'); setTimeout(() => layer.el.remove(), 460);
  if(!layers.length) document.body.style.overflow = '';
  if(layer.prevFocus && document.contains(layer.prevFocus)) try{ layer.prevFocus.focus({preventScroll:true}); }catch(e){}
}
function closeAll(){ layers.slice().forEach(l => closeLayer(l)); }
document.addEventListener('keydown', e => { if(e.key === 'Escape' && layers.length) layers[layers.length-1].close(); });

function confirmSheet({title, msg, action, onConfirm}){
  openLayer(`<div class="amenu"><div class="msg"><b>${esc(title)}</b>${esc(msg)}</div>
    <button class="aitem aitem--danger" data-ok>${ic('trash')}<span class="t"><b>${esc(action)}</b></span></button></div>
    <button class="acancel" data-dismiss>Cancel</button>`, { kind:'action', blur:true, label:title, onMount(el, layer){
      $('[data-ok]', el).addEventListener('click', async () => { layer.close(); await onConfirm(); });
    }});
}

      <div class="frow"><span class="lbl">Brand / product</span><span class="val">${r.brand ? esc(r.brand) : '<span style="color:var(--faint);font-weight:500">Not recorded</span>'}</span></div>
      <div class="frow"><span class="lbl">Oil grade</span><span class="val">${r.grade ? esc(r.grade) : '<span style="color:var(--faint);font-weight:500">Not recorded</span>'}</span></div>
      <div class="frow"><span class="lbl">Odometer</span><span class="val num">${r.odometerKm!=null ? km(r.odometerKm) : '<span style="color:var(--faint);font-weight:500">Not recorded</span>'}</span></div>`;
  }
  const html = `<div class="sheet__head"><button class="circle-btn" data-dismiss aria-label="Close">${ic('close')}</button><h2>${kind==='fuel'?'Refueling':'Engine oil'}</h2><span></span></div>
    <div class="sheet__body">
      <div class="card namecard"><div><div class="serif">${d.label}</div><div class="sub num">${fmtLong(r.dateTime)} · ${fmtTime(r.dateTime)}</div></div><span class="tile tile--lg tile--${d.tile}">${ic(d.icon)}</span></div>
      <div class="fgroup detail-rows">${rows}</div>
      ${r.notes ? `<div class="fgroup"><div class="notebox">${esc(r.notes)}</div></div>` : ''}
      ${r.sample ? `<p class="note-line">This is an example record.</p>` : ''}
      <div class="actions"><button class="trash" id="delBtn" aria-label="Delete record">${ic('trash')}</button><button class="cta" id="editBtn">${ic('edit')}Edit record</button></div>
    </div>`;
  openLayer(html, { label:`${d.label} details`, onMount(el, layer){
    $('#editBtn', el).addEventListener('click', () => { layer.close(); setTimeout(() => openForm(kind, rec), 140); });
    $('#delBtn', el).addEventListener('click', () => confirmSheet({ title:`Delete this ${d.label.toLowerCase()}?`, msg:`${fmtLong(r.dateTime)} · ${d.sub}. Totals update straight away.`, action:'Delete record',
      onConfirm: async () => { const ok = await Store.remove(kind, id); if(ok){ closeAll(); toast('Record deleted'); } } }));
  }});
}

/* ───────── date range ───────── */
function openRange(){
  const opts = [['all','All time'],['month','This month'],['3m','Last 3 months'],['year','This year'],['custom','Custom range']];
  const r = UI.range;
  openLayer(`<div class="amenu"><div class="msg"><b>Date range</b>Filter ${UI.hKind==='oil'?'engine oil':'fuel'} history and its summary.</div>
    ${opts.map(([k,l]) => `<button class="aitem" data-preset="${k}">${ic(k==='custom'?'cal':'clock')}<span class="t"><b>${l}</b></span>${r.preset===k?ic('check','chk'):''}</button>`).join('')}
    <div class="range-custom" id="rc" ${r.preset==='custom'?'':'hidden'}>
      <div class="frow"><label for="rFrom">From</label><span class="vpill">${ic('cal')}<input type="date" id="rFrom" value="${r.from||''}"></span></div>
      <div class="frow"><label for="rTo">To</label><span class="vpill">${ic('cal')}<input type="date" id="rTo" value="${r.to||''}"></span></div>
      <p class="ferr" id="rErr" hidden></p>
      <button class="cta cta--wide" id="rApply">Apply range</button>
    </div></div><button class="acancel" data-dismiss>Cancel</button>`, { kind:'action', blur:true, label:'Date range', onMount(el, layer){
      $$('[data-preset]', el).forEach(b => b.addEventListener('click', () => {
        if(b.dataset.preset === 'custom'){ $('#rc', el).hidden = false; $('#rFrom', el).focus(); return; }
        UI.range = { preset:b.dataset.preset, from:null, to:null }; layer.close(); App.render(true);
      }));
      $('#rApply', el).addEventListener('click', () => { const from = $('#rFrom', el).value || null, to = $('#rTo', el).value || null;
        if(from && to && from > to){ const e = $('#rErr', el); e.hidden = false; e.textContent = 'The start date is after the end date.'; return; }
        UI.range = from || to ? { preset:'custom', from, to } : { preset:'all', from:null, to:null }; layer.close(); App.render(true); });
  }});
}

/* ───────── events ───────── */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-open]'); if(!t || t.closest('.layer')) return;
  if(t.closest('#nav')){ const tab = t.dataset.tab; if(tab && tab !== UI.tab) App.go(tab); return; }
  if(t.id === 'addBtn') return openAddChoice();
  if(t.dataset.add !== undefined){ return t.dataset.add ? openForm(t.dataset.add) : openAddChoice(); }
  if(t.dataset.open){ const [k, id] = t.dataset.open.split(':'); return openDetail(k, id); }
  if(t.dataset.month){ if(UI.month !== t.dataset.month){ UI.month = t.dataset.month; App.render(false); } return; }
  if(t.dataset.act){ UI.actFilter = t.dataset.act; savePrefs(); App.render(false); return; }
  if(t.dataset.gotoHistory){ UI.hKind = t.dataset.gotoHistory; UI.oilType = 'all'; savePrefs(); App.go('history'); return; }
  if(t.dataset.hkind){ UI.hKind = t.dataset.hkind; savePrefs(); App.render(true); return; }
  if(t.dataset.otype){ UI.oilType = t.dataset.otype; App.render(false); return; }
  if(t.id === 'rangeBtn') return openRange();
  if(t.dataset.oilunit){ await Store.saveSettings({ oilUnit:t.dataset.oilunit }); return; }
  if(t.dataset.themeSet){ applyTheme(t.dataset.themeSet); App.render(false); return; }
  if(t.id === 'copyJson'){
    const data = JSON.stringify({ exportedAt:new Date().toISOString(), fuel:Store.fuel, engineOil:Store.oil, settings:Store.settings }, null, 2);
    try { await navigator.clipboard.writeText(data); toast('Records copied as JSON'); }
    catch(err){ openLayer(`<div class="sheet__head"><button class="circle-btn" data-dismiss aria-label="Close">${ic('close')}</button><h2>Your records</h2><span></span></div><div class="sheet__body"><p class="note-line">Select all and copy.</p><div class="fgroup"><textarea class="notes num" id="jsonBox" style="min-height:300px;font-size:12px" readonly>${esc(data)}</textarea></div></div>`, { label:'Records JSON', onMount(el){ const b = $('#jsonBox', el); setTimeout(()=>{ b.focus(); b.select(); }, 80); } }); }
    return;
  }
  if(t.id === 'clearSamples') return confirmSheet({ title:'Remove example records?', msg:'Records you logged yourself stay.', action:'Remove examples', onConfirm: async () => { if(await Store.removeWhere(r => r.sample)) toast('Example records removed'); } });
  if(t.id === 'deleteAll') return confirmSheet({ title:'Delete all records?', msg:`${Store.fuel.length} fuel and ${Store.oil.length} engine oil records will be deleted. This can’t be undone.`, action:'Delete everything', onConfirm: async () => { if(await Store.removeWhere(() => true)) toast('All records deleted'); } });
});
let baseTimer;
document.addEventListener('input', e => {
  if(e.target.id === 'setBase'){ const v = parseNum(e.target.value); e.target.closest('.vpill').classList.toggle('bad', !(v > 0));
    clearTimeout(baseTimer); if(v > 0) baseTimer = setTimeout(async () => { if(Number(Store.settings.defaultBasePrice) !== v){ await Store.saveSettings({ defaultBasePrice:v }); toast('Base price for new entries updated'); } }, 700); }
});

window.MotoLog = { calc, Store, UI, App, openForm, openDetail, exampleRecords };
App.render(true);
Store.boot();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
